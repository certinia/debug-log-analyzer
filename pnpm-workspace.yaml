packages:
  - lana
  - lana-docs
  - log-viewer

overrides:
  # '^' not '>=': a bare '>=' resolves to the newest major and breaks the parent's declared range
  # each fix exists only in a newer major than the parent allows
  '@azure/msal-node@>=5.0.0-beta.0 <7.1.0': '^7.1.0'
  basic-ftp@<6.2.1: '^6.2.1'
  serialize-javascript@<7.1.3: '^7.1.3'
  tinypool@<2.1.2: '^2.1.2'
  uuid@<11.1.1: '^11.1.1'
