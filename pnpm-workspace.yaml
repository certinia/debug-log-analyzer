packages:
  - lana
  - lana-docs
  - log-viewer

# Moved out of .npmrc: pnpm 11+ reads only registry/auth keys from there.
autoInstallPeers: true

# Dependency build scripts, all deliberately declined - nothing here needs them.
# Chromium is installed by `playwright install`; the rest ship prebuilt platform
# packages. `pnpm approve-builds` edits this map.
allowBuilds:
  '@parcel/watcher': false
  '@playwright/browser-chromium': false
  '@swc/core': false
  '@vscode/vsce-sign': false
  core-js: false
  core-js-pure: false
  esbuild: false
  keytar: false
  msgpackr-extract: false
  unrs-resolver: false

overrides:
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': '>=7.29.4'
  '@xmldom/xmldom@<0.8.13': '>=0.8.13'
  brace-expansion@<1.1.13: '>=1.1.13'
  fast-uri@<=3.1.1: '>=3.1.2'
  follow-redirects@<=1.15.11: '>=1.16.0'
  lodash@<=4.17.23: '>=4.18.0'
  path-to-regexp@<0.1.13: '>=0.1.13'
  picomatch@<2.3.2: '>=2.3.2'
  serialize-javascript@<=7.0.2: '>=7.0.3'
  serialize-javascript@>=5.0.0 <7.0.5: '>=7.0.5'
  undici@>=7.0.0 <7.24.0: '>=7.24.0'
  uuid@<11.1.1: '>=11.1.1'
  webpack-dev-server@<=5.2.3: '>=5.2.4'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
