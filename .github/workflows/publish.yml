name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Publish a stable or pre-release extension'
        required: true
        default: stable
        type: choice
        options: [stable, prerelease]
      registries:
        description: 'Public registries for the universal VSIX'
        required: true
        default: all
        type: choice
        options: [all, vsce, ovsx]
      version-bump:
        description: 'Version bump to apply'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: 'Build and validate artifacts without changing Git or publishing'
        required: true
        default: true
        type: boolean

# The shared workflow creates version commits and tags only for live publishing.
permissions:
  actions: read
  contents: write
  packages: write

jobs:
  publish:
    uses: salesforcecli/github-workflows/.github/workflows/vscode-publish-extensions.yml@main
    with:
      branch: ${{ github.ref_name }}
      extensions: lana
      registries: ${{ inputs.registries }}
      pre-release: ${{ inputs.release-type == 'prerelease' }}
      nightly: false
      version-bump: ${{ inputs.version-bump }}
      dry-run: ${{ inputs.dry-run }}
      extensions-root: .
      exclude-web-vsix: 'true'
      node-version: '24'
      package-manager: pnpm
      package-manager-version: '10'
      cache-dependency-path: pnpm-lock.yaml
      install-command: pnpm run ci:install
      package-command: cd lana && pnpm dlx @vscode/vsce package --no-dependencies --out lana-$(node -p "require('./package.json').version").vsix
      prerelease-package-command: cd lana && pnpm dlx @vscode/vsce package --pre-release --no-dependencies --out lana-$(node -p "require('./package.json').version").vsix
      web-package-command: cd lana && pnpm dlx @vscode/vsce package --target web --no-dependencies --out lana-web-$(node -p "require('./package.json').version").vsix
      web-prerelease-package-command: cd lana && pnpm dlx @vscode/vsce package --target web --pre-release --no-dependencies --out lana-web-$(node -p "require('./package.json').version").vsix
      artifact-glob: lana/*.vsix
      publish-web-vsix: true
    secrets: inherit
