name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
  workflow_dispatch:

# Least-privilege default: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  verify_files:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install Packages
        run: pnpm run ci:install
      - name: Lint Files
        run: pnpm run lint

  tests:
    # Split per jest project so they run on parallel runners and failures are isolated.
    # Kept as --runInBand: on 2-vCPU runners the worker pool is slower than serial.
    name: Unit Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [log-viewer, lana]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install Packages
        run: pnpm run ci:install
      - name: Run Jest Tests
        run: pnpm exec jest --selectProjects ${{ matrix.project }} --runInBand

  e2e:
    name: E2E Tests (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      # A localhost page cannot fetch Services from the gallery, so the test server serves this copy.
      - name: Download Salesforce Services
        id: services
        background: true
        run: |
          url=$(curl -fsS https://open-vsx.org/api/salesforce/salesforcedx-vscode-services/latest | jq -er .files.download)
          curl -fsSL -o "$RUNNER_TEMP/services.vsix" "$url"
          unzip -q "$RUNNER_TEMP/services.vsix" 'extension/*' -d "$RUNNER_TEMP/services"
          echo "LANA_SERVICES_EXTENSION_PATH=$RUNNER_TEMP/services/extension" >> "$GITHUB_ENV"
      - name: Install Packages
        run: pnpm run ci:install
      - parallel:
          # No browser cache: Playwright's CI docs say a restore takes about as long as the download.
          # No --with-deps: the runner image has Chromium's libraries, and apt only adds unused fonts.
          - name: Install Chromium
            run: pnpm exec playwright install --only-shell chromium
          - name: Build Log Viewer
            run: pnpm run build:prod
      - wait: services
      # Runs Playwright directly: test:e2e:web would rebuild what the step above built.
      - name: Run Playwright Tests
        run: pnpm exec playwright test --config=lana/test/playwright/playwright.config.web.ts
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-web
          path: lana/playwright-report/web
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-web
          path: lana/test-results/web
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install Packages
        run: pnpm run ci:install
      - name: Build VSCode Package
        run: pnpm --filter lana run build:vsix

  docs:
    name: Docs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install Packages
        run: pnpm run ci:install
      - parallel:
          # The live demo copies the built viewer into the site.
          - name: Build Log Viewer
            run: pnpm run build:prod
          # As in the e2e job: the runner image already has Chromium's libraries.
          - name: Install Chromium
            run: pnpm exec playwright install --only-shell chromium
      # onBrokenLinks is 'throw', so a broken link fails here and not at publish.
      - name: Build Site
        run: pnpm --filter docs-site build
      - name: Test Live Demo
        run: pnpm --filter docs-site test:demo
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-docs
          path: lana-docs/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  gate:
    # The single required status check: the ruleset never needs updating when jobs change.
    name: CI Gate
    needs: [verify_files, tests, e2e, build, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not succeed."
          exit 1
