name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
  workflow_dispatch:

# Least-privilege default: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  verify_files:
    name: Verify Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install Packages
        run: pnpm run ci:install
      - name: Lint Files
        run: pnpm run lint

  tests:
    # Split per jest project so they run on parallel runners and failures are isolated.
    # Kept as --runInBand: on 2-vCPU runners the worker pool is slower than serial.
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [apex-log-parser, log-viewer, lana]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install Packages
        run: pnpm run ci:install
      - name: Tests
        run: pnpm exec jest --selectProjects ${{ matrix.project }} --runInBand

  e2e:
    name: Test (web e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install Packages
        run: pnpm run ci:install
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests
        run: pnpm run test:e2e:web
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: lana/playwright-report/web
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-web
          path: lana/test-results/web
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Verify VSCode Package Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install vsce
        run: pnpm add --global @vscode/vsce
      - name: Install Dependencies
        run: pnpm run ci:install
      - name: Build VSCode Package
        run: |
          cd lana
          vsce package --no-dependencies
