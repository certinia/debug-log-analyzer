name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

# Least-privilege default: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  verify_files:
    name: Verify Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@ph/W-23773464-enable-pnpm-workflows
        with:
          node-version: '24'
          package-manager: pnpm
          package-manager-version: '10'
          cache-dependency-path: pnpm-lock.yaml
          install-command: pnpm run ci:install
      - name: Lint Files
        run: pnpm run lint

  tests:
    # Split per jest project so they run on parallel runners and failures are isolated.
    # Kept as --runInBand: on 2-vCPU runners the worker pool is slower than serial.
    name: Test (${{ matrix.os }}, ${{ matrix.project }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        project: [apex-log-parser, log-viewer, lana]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@ph/W-23773464-enable-pnpm-workflows
        with:
          node-version: '24'
          package-manager: pnpm
          package-manager-version: '10'
          cache-dependency-path: pnpm-lock.yaml
          install-command: pnpm run ci:install
      - name: Tests
        run: pnpm exec jest --selectProjects ${{ matrix.project }} --runInBand

  build:
    name: Verify VSCode Package Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node and install dependencies
        uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@ph/W-23773464-enable-pnpm-workflows
        with:
          node-version: '24'
          package-manager: pnpm
          package-manager-version: '10'
          cache-dependency-path: pnpm-lock.yaml
          install-command: pnpm run ci:install
      - name: Install vsce
        run: pnpm add --global @vscode/vsce
      - name: Build VSCode Package
        run: |
          cd lana
          vsce package --no-dependencies
